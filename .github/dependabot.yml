version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      dependencies:
        patterns: ['*']
    ignore:
      # TypeScript 7 is the native compiler rewrite; wait until vue-tsc supports it.
      - dependency-name: typescript
        update-types: ['version-update:semver-major']
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: monthly
    ignore:
      # Move Node majors by hand, with .nvmrc and engines, once argon2, better-sqlite3,
      # and sharp ship prebuilt binaries for the new version.
      - dependency-name: node
        update-types: ['version-update:semver-major']
