# Publishes the free prebuilt image that compose.yaml uses.
#
# Each architecture builds on its own native runner. Emulated arm64 builds under QEMU
# hung inside nuxt build until GitHub cancelled them at 6 hours, so latest went stale.
name: image

# Every push to main publishes latest. A version tag such as v0.1.0 publishes 0.1.0 and 0.1, for
# owners who'd rather update on purpose than follow main.
on:
  push:
    branches: [main]
    tags: ['v*.*.*']
  workflow_dispatch:

# A slow build must not finish after a newer one and overwrite latest with older code. Grouped by
# ref, so a tag pushed with its commit doesn't cancel the main build.
concurrency:
  group: image-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  build:
    strategy:
      fail-fast: true
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-24.04
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    # A normal build takes about 6 minutes. Fail fast instead of hanging for hours.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: build
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          platforms: ${{ matrix.platform }}
          build-args: GIT_COMMIT=${{ github.sha }}
          outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=${{ matrix.platform }}
          cache-to: type=gha,mode=max,scope=${{ matrix.platform }}
      - name: Save the digest
        run: |
          mkdir -p "$RUNNER_TEMP/digests"
          digest='${{ steps.build.outputs.digest }}'
          touch "$RUNNER_TEMP/digests/${digest#sha256:}"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: digest-${{ matrix.runner }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  # Points the tags at both architectures, only once both have built.
  publish:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          path: ${{ runner.temp }}/digests
          pattern: digest-*
          merge-multiple: true
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Tag the version, or latest, and the commit
        working-directory: ${{ runner.temp }}/digests
        run: |
          tags=(-t "$IMAGE:sha-${GITHUB_SHA::7}")
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            version="${GITHUB_REF_NAME#v}"
            if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              echo "Not a release version: $GITHUB_REF_NAME" >&2
              exit 1
            fi
            tags+=(-t "$IMAGE:$version" -t "$IMAGE:${version%.*}")
          else
            tags+=(-t "$IMAGE:latest")
          fi
          docker buildx imagetools create "${tags[@]}" $(printf "$IMAGE@sha256:%s " *)
          echo "PRIMARY=${tags[3]}" >> "$GITHUB_ENV"
      - run: docker buildx imagetools inspect "$PRIMARY"
