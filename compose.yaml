# Copy .env.example to .env, fill it in, then run: docker compose up -d
services:
  app:
    # latest follows main. Set OPENMANTEL_VERSION in .env (for example 0.1 or 0.1.0) to stay on a release.
    image: ghcr.io/cschweda/openmantel:${OPENMANTEL_VERSION:-latest}
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      NUXT_DB_PATH: /data/pictures.db
      NUXT_PICTURES_DIR: /data
    volumes:
      - pictures:/data

  # Gets and renews the HTTPS certificate for DOMAIN.
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      - app
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      DOMAIN: ${DOMAIN:?Set DOMAIN in .env}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

  # Takes a checked database snapshot at start and every 24 hours, and keeps 14 days of them.
  backup:
    image: ghcr.io/cschweda/openmantel:${OPENMANTEL_VERSION:-latest}
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      NUXT_DB_PATH: /data/pictures.db
      NUXT_PICTURES_DIR: /data
    command: ["sh", "-c", "sleep 60; while true; do ./scripts/backup.sh; sleep 86400; done"]
    healthcheck:
      disable: true
    volumes:
      - pictures:/data

volumes:
  pictures:
  caddy_data:
  caddy_config:
